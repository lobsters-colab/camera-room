<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8572a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健身追蹤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>健身追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#16181d;--mute:#6b6f78;--line:#e6e2da;--acc:#e8572a;--acc-ink:#fff;--ok:#1f7a5c;--warn:#b45309;--soft:#fbe9e2;--okbg:#e3f1ea;--warnbg:#fdf0dc;--chip:#efece6}
@media (prefers-color-scheme:dark){:root{--bg:#111215;--card:#1b1d22;--ink:#f1f1f3;--mute:#9a9ea8;--line:#2c2f36;--acc:#ff6a3d;--acc-ink:#1b0d07;--ok:#45c495;--warn:#f5a54a;--soft:#3a2219;--okbg:#16302a;--warnbg:#36280f;--chip:#25282e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
body.noauth nav.tabs{display:none}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px}
header.top h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.5px}
header.top .sub{color:var(--mute);font-size:13px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--mute);white-space:nowrap}
.banner{background:var(--warnbg);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700}
.card h3{font-size:15px;margin:0 0 6px;font-weight:700}
.muted{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.hero{background:var(--acc);color:var(--acc-ink);border:none}
.hero .muted{color:inherit;opacity:.8}
.hero .big{font-size:24px;font-weight:900;margin:2px 0 4px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:500;padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.hero .btn.pri{background:var(--acc-ink);color:var(--acc);border-color:transparent}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:#d23c3c}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mute)}
.ex-list{list-style:none;margin:0;padding:0}
.ex-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.ex-list li:first-child{border-top:none}
.ex-list .rx{color:var(--mute);font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--mute);margin-right:6px;vertical-align:1px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dayhead .wd{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:1px}
.today-mark{outline:2px solid var(--acc);outline-offset:-1px}
/* form */
label.fl{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 12px;border-radius:10px;background:var(--chip);font-size:14px;cursor:pointer;border:1px solid transparent}
.seg input:checked+label{background:var(--ink);color:var(--bg);font-weight:700}
input.tx,select.tx,textarea.tx{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea.tx{resize:vertical;min-height:70px}
/* session */
.exc{padding:14px}
.exc .nm{font-weight:700;font-size:16px}
.hint{font-size:12.5px;background:var(--okbg);color:var(--ok);border-radius:8px;padding:6px 9px;margin:8px 0 4px}
.hint.neutral{background:var(--chip);color:var(--mute)}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setrow .n{color:var(--mute);font-size:13px;text-align:center}
.setrow input{font:inherit;font-size:16px;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 4px;width:100%}
.setrow .ck{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-size:18px;cursor:pointer}
.setrow.done input{background:var(--okbg);border-color:transparent}
.setrow.done .ck{background:var(--ok);color:#fff;border-color:var(--ok)}
.useg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.useg button{appearance:none;border:none;background:transparent;color:var(--mute);font:inherit;font-size:12.5px;padding:5px 9px;cursor:pointer}
.useg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.colhd{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:11px;color:var(--mute);text-align:center;margin-top:10px}
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(532px,calc(100% - 28px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restbar b{font-size:22px;font-variant-numeric:tabular-nums}
.restbar .btn{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5)}
/* insights */
.ins{border-left:4px solid var(--line)}
.ins.good{border-left-color:var(--ok)}
.ins.tip{border-left-color:var(--acc)}
.ins.warn{border-left-color:var(--warn)}
.ins .lv{font-size:11px;font-weight:700;letter-spacing:1px}
.ins.good .lv{color:var(--ok)}.ins.tip .lv{color:var(--acc)}.ins.warn .lv{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipbtn{font:inherit;font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.ai-out{white-space:normal;font-size:14.5px;margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.ai-out ul{margin:6px 0;padding-left:20px}.ai-out p{margin:6px 0}
/* history */
.wk{cursor:pointer}
.wk .meta{font-size:13px;color:var(--mute)}
.wk .det{margin-top:8px;font-size:13.5px}
.wk .det div{padding:3px 0}
.pr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.pr:first-of-type{border-top:none}
svg text{font-family:inherit}
/* tabbar */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;appearance:none;background:none;border:none;color:var(--mute);font:inherit;font-size:11.5px;padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
/* parts */
.ptag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;color:#fff;margin-right:6px;vertical-align:1px;font-weight:700}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pick{appearance:none;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:15px}
.pick .dot{width:12px;height:12px;border-radius:50%}
.pick.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--card))}
.pick small{font-weight:400;font-size:11px;color:var(--mute)}
.timer{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
/* calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhd b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{font-size:11px;color:var(--mute);text-align:center;padding:2px 0}
.cal .c{aspect-ratio:1/1.05;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 5px;font-size:13px;cursor:pointer;border:2px solid transparent;font-variant-numeric:tabular-nums}
.cal .c.out{visibility:hidden}
.cal .c.on{background:var(--soft);font-weight:700}
.cal .c.td{border-color:var(--ink)}
.cal .c.sel{border-color:var(--acc)}
.cal .c.fut{opacity:.45}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:30px;min-height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%;display:block}
.pbar{display:grid;grid-template-columns:42px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.pbar .tr{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.pbar .tr i{display:block;height:100%;border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mute);margin-top:10px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;border-radius:50%;display:block}
.spacer{height:8px}
/* ---- 開啟動畫 ---- */
#splash{position:fixed;inset:0;z-index:100;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px calc(40px + env(safe-area-inset-bottom));text-align:center;transition:opacity .45s ease,transform .45s ease;cursor:pointer;-webkit-user-select:none;user-select:none}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .db{width:96px;height:96px;animation:lift 1.1s cubic-bezier(.3,1.4,.5,1) both}
#splash .db rect{fill:#fff}
#splash .q{font-size:23px;font-weight:900;line-height:1.5;margin-top:34px;max-width:340px;letter-spacing:.5px;opacity:0;animation:qin .7s .45s ease-out forwards;text-wrap:balance}
#splash .q::before{content:'「';opacity:.6}#splash .q::after{content:'」';opacity:.6}
#splash .bar{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:fill var(--d,2.4s) linear forwards}
#splash .skip{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));font-size:12px;opacity:.7}
@keyframes lift{0%{transform:translateY(40px) scale(.6);opacity:0}45%{transform:translateY(-18px) scale(1.06);opacity:1}65%{transform:translateY(4px) scale(.98)}100%{transform:none}}
@keyframes qin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash .db,#splash .q,#splash .bar i{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="splash" role="dialog" aria-label="開啟畫面">
  <svg class="db" viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="30" width="9" height="40" rx="3"/><rect x="23" y="22" width="11" height="56" rx="3"/><rect x="34" y="45" width="32" height="10" rx="5"/><rect x="66" y="22" width="11" height="56" rx="3"/><rect x="79" y="30" width="9" height="40" rx="3"/></svg>
  <div class="q" id="splashQ"></div>
  <div class="skip">點一下跳過</div>
  <div class="bar"><i></i></div>
</div>
<script>
(function(){
  var Q=['怕輸才會緊張，想贏才會興奮！'];
  var el=document.getElementById('splash'),q=document.getElementById('splashQ'),done=false,t;
  function pick(){var last=-1;try{last=+localStorage.getItem('ft-lastq')}catch(e){}var i;do{i=Math.floor(Math.random()*Q.length)}while(i===last&&Q.length>1);try{localStorage.setItem('ft-lastq',i)}catch(e){}return Q[i]}
  function hide(){if(done)return;done=true;clearTimeout(t);el.classList.add('out');setTimeout(function(){el.style.display='none'},460)}
  function show(){
    var s=pick();q.innerHTML='';var parts=[],cur='';for(var k=0;k<s.length;k++){cur+=s[k];if('，？'.indexOf(s[k])>=0&&k<s.length-1){parts.push(cur);cur=''}}if(cur)parts.push(cur);parts.forEach(function(p,i){q.appendChild(document.createTextNode(p));if(i<parts.length-1&&s.length>11)q.appendChild(document.createElement('br'))});done=false;
    var d=Math.min(3600,Math.max(2200,1300+s.length*70));
    el.style.setProperty('--d',d+'ms');el.style.display='flex';
    // 重新觸發動畫
    [].forEach.call(el.querySelectorAll('.db,.q,.bar i'),function(n){n.style.animation='none';void n.offsetWidth;n.style.animation=''});
    el.classList.remove('out');t=setTimeout(hide,d);
  }
  el.addEventListener('click',hide);
  try{show()}catch(e){el.style.display='none'}
  // 從背景回來超過 10 分鐘，也當作「重新打開」
  var hiddenAt=0;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')hiddenAt=Date.now();
    else if(hiddenAt&&Date.now()-hiddenAt>10*60*1000){var a=document.querySelector('#elapsed');if(!a)show()}
  });
})();
</script>
<div class="wrap">
  <header class="top">
    <div><div class="sub" id="dateline"></div><h1>健身追蹤</h1></div>
    <span class="badge" id="modebadge">載入中</span>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="rest"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
